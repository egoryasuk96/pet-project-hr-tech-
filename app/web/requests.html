<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мои заявки — HR Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-brand">HR Tech</div>
        <nav class="topbar-nav" aria-label="Основная навигация">
          <a href="/my-requests" class="is-active">Мои заявки</a>
          <a href="/my-notifications">Уведомления</a>
        </nav>
      </div>
      <div class="topbar-right">
        <span class="topbar-user" id="user-name"></span>
        <button type="button" class="btn btn-ghost" id="logout-btn">Выйти</button>
      </div>
    </header>

    <main class="page-body">
      <div class="page-header">
        <h1 class="page-title">Мои заявки</h1>
        <button type="button" class="btn btn-primary" id="create-btn" style="width: auto">
          + Создать заявку
        </button>
      </div>

      <div class="filters" id="filters" role="tablist" aria-label="Фильтр по статусу">
        <button type="button" class="chip is-active" data-status="">Все</button>
        <button type="button" class="chip" data-status="draft">Черновики</button>
        <button type="button" class="chip" data-status="in_approval">На согласовании</button>
        <button type="button" class="chip" data-status="approved">Согласовано</button>
        <button type="button" class="chip" data-status="rejected">Отклонено</button>
      </div>

      <div class="state-panel" id="state-loading" hidden>
        <div class="table-wrap" style="border: none; background: transparent; padding: 0">
          <div class="skeleton-row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
          <div class="skeleton-row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
          <div class="skeleton-row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
          <div class="skeleton-row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
        </div>
      </div>

      <div class="state-panel" id="state-empty" hidden>
        <h2>Заявок пока нет</h2>
        <p>Создайте первую заявку, когда будете готовы.</p>
      </div>

      <div class="state-panel" id="state-filter-empty" hidden>
        <h2>Ничего не найдено</h2>
        <p>По выбранному фильтру заявок нет.</p>
      </div>

      <div class="state-panel" id="state-error" hidden>
        <h2>Не удалось загрузить заявки</h2>
        <p id="state-error-message">Произошла внутренняя ошибка. Попробуйте позже</p>
        <button type="button" class="btn btn-secondary" id="retry-btn">Повторить</button>
      </div>

      <div class="table-wrap" id="table-wrap" hidden>
        <table class="requests-table">
          <thead>
            <tr>
              <th>Тип заявки</th>
              <th>Дата создания</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="requests-tbody"></tbody>
        </table>
      </div>
    </main>

    <script src="/static/js/session.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/requests.js"></script>
  </body>
</html>
