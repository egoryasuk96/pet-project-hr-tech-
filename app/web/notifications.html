<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Уведомления — HR Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-brand">HR Tech</div>
        <nav class="topbar-nav" aria-label="Основная навигация">
          <a href="/requests">Мои заявки</a>
          <a href="/notifications" class="is-active">Уведомления</a>
        </nav>
      </div>
      <div class="topbar-right">
        <span class="topbar-user" id="user-name"></span>
        <button type="button" class="btn btn-ghost" id="logout-btn">Выйти</button>
      </div>
    </header>

    <main class="page-body">
      <div class="page-header">
        <h1 class="page-title">Уведомления</h1>
      </div>

      <div class="state-panel" id="state-loading">
        <div class="notif-skeleton">
          <div class="skeleton-bar"></div>
          <div class="skeleton-bar"></div>
          <div class="skeleton-bar"></div>
        </div>
      </div>

      <div class="state-panel" id="state-empty" hidden>
        <h2>Уведомлений пока нет</h2>
        <p>Когда появятся события по заявкам, они отобразятся здесь.</p>
      </div>

      <div class="state-panel" id="state-error" hidden>
        <h2>Не удалось загрузить уведомления</h2>
        <p id="state-error-message">Произошла внутренняя ошибка. Попробуйте позже</p>
        <button type="button" class="btn btn-secondary" id="retry-btn">Повторить</button>
      </div>

      <div class="notif-list" id="notif-list" hidden></div>
    </main>

    <script src="/static/js/session.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/notifications.js"></script>
  </body>
</html>
